services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: inboxdraft
      POSTGRES_PASSWORD: inboxdraft
      POSTGRES_DB: inboxdraft
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inboxdraft -d inboxdraft"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://inboxdraft:inboxdraft@db:5432/inboxdraft
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge:/app/knowledge
      - ./inbox:/app/inbox
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
