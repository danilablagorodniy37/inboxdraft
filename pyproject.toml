[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inboxdraft"
version = "0.1.0"
description = "AI-drafted email replies from your own documents. A person sends every email."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Daniel Blago" }]
keywords = ["email", "rag", "llm", "human-in-the-loop", "fastapi", "pgvector", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "anthropic>=0.40",
  "numpy>=1.26",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "fastembed>=0.4",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
inboxdraft = "inboxdraft.cli:main"

[project.urls]
Homepage = "https://github.com/danilablagorodniy37/inboxdraft"
Issues = "https://github.com/danilablagorodniy37/inboxdraft/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inboxdraft = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "E501"]  # the formatter wraps code; E501 only fires on prompt strings

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pg: needs a PostgreSQL database with pgvector (set TEST_DATABASE_URL)"]
filterwarnings = ["ignore::DeprecationWarning"]
